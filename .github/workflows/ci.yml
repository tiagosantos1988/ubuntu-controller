name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Se dois pushes chegam juntos, o mais novo manda: o antigo nao precisa terminar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK (assembleRelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O pacote "tools" nao existe mais no repositorio do SDK e o padrao da
      # action ainda o pede (falhava com "Failed to find package 'tools'").
      - name: SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # Sem keystore.properties o build cai para a chave de debug (ver
      # app/build.gradle.kts): a CI prova que o projeto compila, sem guardar
      # segredo nenhum no repositorio.
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v5
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  deb:
    name: Pacote .deb
    runs-on: ubuntu-latest
    # em tag, o pacote vai para a release daquele tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Empacotar
        run: ./empacotar-deb.sh

      - name: Conferir o pacote
        run: |
          dpkg-deb -I dist/ubuntu-controller_*_all.deb
          echo "--- conteudo"
          dpkg-deb -c dist/ubuntu-controller_*_all.deb | awk '{print $1, $6}'

      - name: Guardar o .deb
        uses: actions/upload-artifact@v5
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber

  protocolo:
    name: Protocolo (agente simulado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install evdev

      # O agente e o teste leem o mesmo arquivo de token; o teste cobre
      # autenticacao, limites, comandos invalidos e os eixos do gamepad.
      - name: Teste de fumaca
        run: |
          mkdir -p ~/.config/controle-remoto
          echo "0123456789abcdef0123456789abcdef" > ~/.config/controle-remoto/token
          chmod 600 ~/.config/controle-remoto/token
          cd servidor
          python3 agente.py --simular --porta 8799 > /tmp/agente.log 2>&1 &
          sleep 3
          python3 teste_protocolo.py --porta 8799 --token 0123456789abcdef0123456789abcdef
          echo "--- log do agente"
          cat /tmp/agente.log
